spring.application.name=order-management-spring

# Plataformas como o Render informam a porta em PORT; SERVER_PORT ou --server.port explicitos continuam valendo antes deste padrao.
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
# No default: DatasourcePasswordGuard stops startup when SPRING_DATASOURCE_PASSWORD is missing (D021). Never commit credentials.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway is the only source of the schema (decision A2); Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate

# Session identifier is never readable by browser JavaScript.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

# Contrato v4: propriedade desconhecida no corpo responde 400 (MALFORMED_REQUEST).
spring.jackson.deserialization.fail-on-unknown-properties=true
# Inteiro do contrato (quantidade, parcelas) nao aceita decimal: 1.5 responde 400 em vez de virar 1 (CT-STOCK-101).
spring.jackson.deserialization.accept-float-as-int=false

# Foto de produto (V13, plano comercial secao 05). O diretorio e de objetos privados: nunca dentro de uma pasta
# servida estaticamente, e em producao aponta para o volume ou o bucket do ambiente. Sem a variavel, o padrao e
# uma pasta temporaria -- serve para desenvolvimento e some ao reiniciar a maquina.
sbi.product-photos.dir=${SBI_PRODUCT_PHOTOS_DIR:${java.io.tmpdir}/sbi-fotos-produto}
sbi.product-photos.max-bytes=${SBI_PRODUCT_PHOTOS_MAX_BYTES:3145728}
# O container barra o corpo antes de a aplicacao ler: o teto fica um pouco acima do limite da regra, para a
# resposta ser o 400 do contrato e nao um erro do servidor.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
